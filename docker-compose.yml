version: '3.8'

services:
  ocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-pipeline-api
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cuda
      - BATCH_SIZE_DETECTION=32
      - BATCH_SIZE_RECOGNITION=128
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./model_path:/app/model_path
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  model_path:
  examples:
